description "Node-RED HMI (trusty chroot, kernel 3.0.68)"

start on filesystem
stop on shutdown
respawn
respawn limit 5 60

pre-start script
    mountpoint -q /data/chroot14/proc || mount -o bind /proc /data/chroot14/proc
    mountpoint -q /data/chroot14/dev || mount -o bind /dev /data/chroot14/dev
    mountpoint -q /data/chroot14/sys || mount -o bind /sys /data/chroot14/sys
end script

# NOTE: precise's chroot is /usr/sbin/chroot, not /usr/bin/chroot. The copy
# running on the board was fixed with `sed -i 's|/usr/bin/chroot|chroot|'`
# (bare name → upstart's default PATH finds it in /usr/sbin).
exec chroot /data/chroot14 /usr/bin/env PATH=/usr/local/node10/bin:/usr/bin:/bin:/usr/sbin:/sbin HOME=/root node-red --userDir /data/nodered

post-stop script
    umount /data/chroot14/proc 2>/dev/null
    umount /data/chroot14/sys 2>/dev/null
    umount /data/chroot14/dev 2>/dev/null
end script
