# Force 1920x1080 on the HDMI framebuffer and paint the boot splash a few
# seconds into boot, so the monitor gets a signal long before Xorg starts. The
# vendor u-boot env leaves fb_x_res/fb_y_res/hdmi_phy_res empty -> s3cfb sits
# at 1024x1200 -> the PHY cannot clock it out -> "No Signal" until X (~20 s).
# Script: /root/fb_early.py (repo copy os/desktop/fb_early.py).
#
# `started mountall`, NOT `startup`: the rootfs is still mounted read-only at
# `startup`, so the log redirection below used to abort the job before python
# ever ran (the 2026-10-12/13 versions never executed once at boot; proven by
# the "Read-only file system" lines in fb-early.log + no pixclk line in
# dmesg). The script re-paints every second until Xorg takes over, because
# the monitor only reports HDMI online ~17 s in and hotplug may renegotiate.
description "Early HDMI mode-set + boot splash (before X)"

start on started mountall

script
    /usr/bin/python2 /root/fb_early.py >> /var/log/upstart/fb-early.log 2>&1
end script
